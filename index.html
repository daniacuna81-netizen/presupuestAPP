<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PresupuestAPP — SaaS Obras & Servicios B2B</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
  <style>
    /* ══════════════════════════════════════════════════════
       DESIGN TOKENS — LIGHT & DARK
    ══════════════════════════════════════════════════════ */
    :root {
      --bg:          #F9FAFB;
      --surface:     #FFFFFF;
      --surface2:    #F3F4F6;
      --surface3:    #E5E7EB;
      --border:      #E5E7EB;
      --text:        #111827;
      --text2:       #374151;
      --text3:       #6B7280;
      --text4:       #9CA3AF;
      --accent:      #2563EB;
      --accent-h:    #1D4ED8;
      --accent-bg:   #EFF6FF;
      --accent-bg2:  #DBEAFE;
      --pro:         #7C3AED;
      --pro-h:       #6D28D9;
      --pro-bg:      #F5F3FF;
      --pro-bg2:     #EDE9FE;
      --success:     #16A34A;
      --success-h:   #15803D;
      --success-bg:  #F0FDF4;
      --success-bg2: #DCFCE7;
      --warning:     #D97706;
      --warning-bg:  #FFFBEB;
      --warning-bg2: #FEF3C7;
      --danger:      #DC2626;
      --danger-bg:   #FEF2F2;
      --danger-bg2:  #FECACA;
      --shadow-sm:   0 1px 2px rgba(0,0,0,0.05), 0 0 0 1px rgba(0,0,0,0.04);
      --shadow:      0 1px 4px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.04);
      --shadow-md:   0 4px 14px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
      --shadow-lg:   0 8px 28px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.07);
      --radius-sm:   8px;
      --radius:      14px;
      --radius-lg:   20px;
      --sidebar-w:   284px;
      --easing:      cubic-bezier(0.4, 0, 0.2, 1);
      --spring:      cubic-bezier(0.34, 1.56, 0.64, 1);
      --t:           0.2s;
    }
    [data-theme="dark"] {
      --bg:          #0D1117;
      --surface:     #161B22;
      --surface2:    #21262D;
      --surface3:    #30363D;
      --border:      #30363D;
      --text:        #E6EDF3;
      --text2:       #CDD9E5;
      --text3:       #8B949E;
      --text4:       #6E7681;
      --accent:      #58A6FF;
      --accent-h:    #79B8FF;
      --accent-bg:   #1C2D3F;
      --accent-bg2:  #0D2137;
      --pro:         #A78BFA;
      --pro-h:       #C4B5FD;
      --pro-bg:      #2E1065;
      --pro-bg2:     #3B0764;
      --success:     #3FB950;
      --success-h:   #56D364;
      --success-bg:  #0C1E12;
      --success-bg2: #122A1A;
      --warning:     #E3B341;
      --warning-bg:  #2D1F00;
      --warning-bg2: #3D2A00;
      --danger:      #F85149;
      --danger-bg:   #2D0C0C;
      --danger-bg2:  #450A0A;
      --shadow-sm:   0 1px 2px rgba(0,0,0,0.3);
      --shadow:      0 1px 4px rgba(0,0,0,0.4);
      --shadow-md:   0 4px 14px rgba(0,0,0,0.45);
      --shadow-lg:   0 8px 28px rgba(0,0,0,0.55);
    }

    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background var(--t) var(--easing), color var(--t) var(--easing);
      -webkit-font-smoothing: antialiased;
    }
    input, select, textarea, button { font-family: inherit; }
    a { text-decoration: none; color: inherit; }

    /* LAYOUT SHELL */
    .app-shell { display: flex; min-height: 100vh; position: relative; }
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      position: fixed;
      top: 0; left: 0;
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      z-index: 20;
      transition: background var(--t) var(--easing), border-color var(--t) var(--easing);
    }
    .sidebar::-webkit-scrollbar { width: 0; }
    .main-area { flex: 1; margin-left: var(--sidebar-w); display: flex; flex-direction: column; min-height: 100vh; transition: all 0.3s ease; }

    .topbar {
      position: sticky; top: 0; z-index: 15;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background var(--t), border-color var(--t);
    }
    [data-theme="dark"] .topbar { background: rgba(22,27,34,0.88); }
    .content { flex: 1; padding: 26px 24px 60px; max-width: 860px; margin: 0 auto; width: 100%; }

    /* MOBILE SIMULATOR BEZEL (WHEN ACTIVE ON DESKTOP) */
    .simulated-mobile-wrapper {
      background: rgba(0,0,0,0.06);
      padding: 24px 0 60px;
      display: flex;
      justify-content: center;
      min-height: calc(100vh - 65px);
    }
    [data-theme="dark"] .simulated-mobile-wrapper { background: rgba(0,0,0,0.4); }

    .phone-bezel {
      width: 100%;
      max-width: 410px;
      border: 11px solid #1F2937;
      border-radius: 46px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255,255,255,0.1);
      background: var(--bg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 840px;
    }
    [data-theme="dark"] .phone-bezel { border-color: #030712; }

    .phone-notch-bar {
      height: 24px;
      background: #1F2937;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    [data-theme="dark"] .phone-notch-bar { background: #030712; }
    .phone-speaker {
      width: 55px; height: 4px; border-radius: 999px; background: #374151;
    }
    .phone-screen-content {
      flex: 1; overflow-y: auto; padding: 14px 14px 40px;
    }

    /* RESPONSIVE REAL DEVICE BREAKPOINTS */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main-area { margin-left: 0; }
      .topbar { padding: 9px 12px; }
      .content { padding: 16px 12px 100px; max-width: 100%; }
      .desktop-only { display: none !important; }
      .mobile-only { display: flex !important; }
      .sim-toggle-btn { display: none !important; }
    }
    @media (min-width: 769px) {
      .mobile-only { display: none !important; }
    }

    /* BUTTONS */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      border: none; outline: none; cursor: pointer; font-weight: 600;
      border-radius: var(--radius); transition: all var(--t) var(--spring);
      white-space: nowrap; position: relative; overflow: hidden; user-select: none;
    }
    .btn::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit;
      background: white; opacity: 0; transition: opacity 0.15s;
    }
    .btn:hover::after { opacity: 0.08; }
    .btn:active { transform: scale(0.96) !important; }

    .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 1px 3px rgba(37,99,235,0.25); }
    .btn-primary:hover { background: var(--accent-h); transform: scale(1.025) translateY(-1px); box-shadow: 0 6px 18px rgba(37,99,235,0.35); }

    .btn-pro {
      background: linear-gradient(135deg, #7C3AED 0%, #2563EB 100%);
      color: #fff; box-shadow: 0 2px 10px rgba(124,58,237,0.35);
    }
    .btn-pro:hover { transform: scale(1.03) translateY(-1px); box-shadow: 0 6px 20px rgba(124,58,237,0.45); }

    .btn-success { background: var(--success); color: #fff; box-shadow: 0 1px 3px rgba(22,163,74,0.25); }
    .btn-success:hover { background: var(--success-h); transform: scale(1.025) translateY(-1px); }

    .btn-ghost { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--surface3); color: var(--text); transform: scale(1.02) translateY(-1px); }

    .btn-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-bg2); }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: var(--radius-sm); }
    .btn-md { padding: 10px 18px; font-size: 14px; }
    .btn-lg { padding: 14px 20px; font-size: 15px; width: 100%; }

    .btn-pill {
      padding: 5px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
      border: 1px solid var(--border); background: var(--surface2); color: var(--text2);
      cursor: pointer; transition: all var(--t) var(--spring); display: inline-flex; align-items: center; gap: 4px;
    }
    .btn-pill:hover { background: var(--surface3); transform: scale(1.04); }

    /* INPUTS & CARDS */
    .field {
      width: 100%; padding: 11px 13px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-size: 14.5px; outline: none;
      transition: border-color var(--t), box-shadow var(--t), background var(--t);
    }
    .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.14); }
    .field-label { display: block; font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 6px; }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      transition: background var(--t), border-color var(--t), box-shadow var(--t);
    }

    /* STEP NAV */
    .step-item {
      display: flex; align-items: center; gap: 11px;
      padding: 10px 12px; border-radius: 10px;
      cursor: pointer; margin: 2px 8px;
      transition: all var(--t) var(--easing); user-select: none;
    }
    .step-item:hover { background: var(--surface2); }
    .step-item.active { background: var(--accent-bg); }

    .step-dot {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; flex-shrink: 0;
      transition: all var(--t) var(--spring);
    }
    .step-dot.pending { background: var(--surface2); color: var(--text4); border: 2px solid var(--border); }
    .step-dot.active  { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(37,99,235,0.4); }
    .step-dot.done    { background: var(--success); color: #fff; box-shadow: 0 2px 6px rgba(22,163,74,0.35); }

    /* CATEGORIES & ITEMS */
    .cat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    @media (max-width: 560px) { .cat-grid { grid-template-columns: repeat(3, 1fr); } }

    .cat-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
      padding: 14px 6px; background: var(--surface);
      border: 1.5px solid var(--border); border-radius: var(--radius);
      cursor: pointer; text-align: center; outline: none;
      transition: all var(--t) var(--spring);
    }
    .cat-btn:hover {
      border-color: var(--accent); background: var(--accent-bg);
      transform: scale(1.05) translateY(-3px);
      box-shadow: var(--shadow-md);
    }
    .cat-icon-wrap {
      width: 40px; height: 40px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      transition: transform var(--t) var(--spring);
    }
    .cat-btn:hover .cat-icon-wrap { transform: scale(1.12) rotate(-3deg); }
    .cat-label { font-size: 11px; font-weight: 700; color: var(--text2); line-height: 1.2; }

    .item-row {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 14px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius);
      transition: all var(--t) var(--easing);
    }
    .item-icon {
      width: 38px; height: 38px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }

    /* MODAL BLUR & SHEETS */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,0.60);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex; align-items: flex-end; justify-content: center;
    }
    @media (min-width: 640px) { .modal-overlay { align-items: center; } }
    .modal-sheet {
      background: var(--surface); border-radius: 24px 24px 0 0;
      padding: 24px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
      animation: slideUp 0.3s var(--spring);
      transition: background var(--t);
    }
    @media (min-width: 640px) {
      .modal-sheet { border-radius: 22px; margin: 20px; animation: scaleUp 0.25s var(--spring); }
    }

    /* CATALOG MODAL SPECIFIC (HIGH PERFORMANCE & SCROLLABLE) */
    .catalog-modal-sheet {
      background: var(--surface); border-radius: 26px 26px 0 0;
      padding: 18px 20px 14px; width: 100%; max-width: 680px; max-height: 92vh;
      display: flex; flex-direction: column; animation: slideUp 0.3s var(--spring);
      box-shadow: 0 25px 60px rgba(0,0,0,0.3);
    }
    @media (min-width: 640px) {
      .catalog-modal-sheet { border-radius: 24px; margin: 20px; animation: scaleUp 0.25s var(--spring); }
    }
    .catalog-scrollable {
      flex: 1; overflow-y: auto; padding-right: 4px; margin: 8px 0;
    }
    .catalog-scrollable::-webkit-scrollbar { width: 4px; }
    .catalog-scrollable::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

    .catalog-group-title {
      font-size: 11px; font-weight: 800; letter-spacing: 0.07em;
      text-transform: uppercase; color: var(--text3);
      padding: 12px 6px 6px; border-bottom: 1.5px solid var(--border);
      margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between;
    }
    .catalog-item-card {
      padding: 10px 12px; background: var(--surface);
      border: 1.5px solid var(--border); border-radius: 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin-bottom: 7px; transition: all 0.15s var(--easing);
    }
    .catalog-item-card.has-qty {
      border-color: var(--accent);
      background: var(--accent-bg);
      box-shadow: 0 2px 8px rgba(37,99,235,0.12);
    }
    .catalog-item-card:hover {
      border-color: var(--accent-h);
    }

    /* TACTILE STEPPERS (MOBILE-OPTIMIZED) */
    .stepper-wrap {
      display: inline-flex; align-items: center; gap: 3px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 3px; flex-shrink: 0;
    }
    .stepper-btn {
      width: 34px; height: 34px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      border: none; background: var(--surface); color: var(--text);
      font-weight: 900; font-size: 17px; cursor: pointer;
      user-select: none; transition: all 0.15s; flex-shrink: 0;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .stepper-btn:hover { background: var(--accent); color: #fff; transform: scale(1.08); }
    .stepper-btn:active { transform: scale(0.92); }
    .stepper-input {
      width: 48px; text-align: center; border: none; background: transparent;
      font-size: 14px; font-weight: 800; color: var(--text); outline: none;
    }

    .catalog-footer-sticky {
      border-top: 1px solid var(--border);
      padding-top: 12px; margin-top: 4px;
      background: var(--surface); flex-shrink: 0;
    }

    @keyframes slideUp  { from { transform: translateY(60%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes scaleUp  { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes fadeIn   { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.25s var(--easing); }

    /* CHIPS, BADGES, TOGGLES */
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .chip-pro { background: linear-gradient(135deg, #EDE9FE 0%, #DBEAFE 100%); color: #6D28D9; border: 1px solid #C4B5FD; font-weight: 800; }
    [data-theme="dark"] .chip-pro { background: #2E1065; color: #C4B5FD; border-color: #5B21B6; }

    .badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px; border-radius: 999px;
      font-size: 11px; font-weight: 800; background: var(--accent); color: #fff;
    }

    .pro-badge-pill {
      font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
      padding: 2px 7px; border-radius: 6px;
      background: linear-gradient(135deg, #7C3AED, #2563EB);
      color: #fff; display: inline-flex; align-items: center; gap: 3px;
    }

    .desperdicio-btn, .sub-option-btn {
      flex: 1; padding: 10px 6px; border-radius: 10px; border: 1.5px solid var(--border);
      background: var(--surface); color: var(--text3); cursor: pointer; text-align: center;
      transition: all var(--t) var(--spring);
    }
    .desperdicio-btn.on, .sub-option-btn.active { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); font-weight: 700; }

    .inflation-btn {
      flex: 1; padding: 9px 4px; border-radius: 8px; font-size: 12px; font-weight: 800;
      border: 1.5px solid var(--warning-bg2); background: var(--warning-bg); color: var(--warning);
      cursor: pointer; text-align: center; transition: all var(--t) var(--spring);
    }
    .inflation-btn:hover { transform: scale(1.06) translateY(-2px); }

    .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; }
    .summary-row + .summary-row { border-top: 1px solid var(--border); }
    .total-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0 2px; border-top: 2px solid var(--text); margin-top: 4px; }

    .mob-stepbar { display: flex; align-items: center; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .mob-dot { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex-shrink: 0; }
    .mob-line { flex: 1; height: 2px; border-radius: 999px; }

    .theme-pill {
      position: relative; width: 40px; height: 22px;
      background: var(--surface3); border: none; border-radius: 999px;
      cursor: pointer; transition: background 0.25s var(--easing); flex-shrink: 0;
    }
    [data-theme="dark"] .theme-pill { background: var(--accent); }
    .theme-pill::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--text3); transition: all 0.25s var(--spring);
    }
    [data-theme="dark"] .theme-pill::after { left: calc(100% - 19px); background: #fff; }

    .wa-box {
      background: var(--success-bg); border: 1px solid var(--success-bg2);
      border-radius: var(--radius); padding: 14px;
      font-size: 11.5px; line-height: 1.6; color: var(--success);
      white-space: pre-wrap; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      word-break: break-word; max-height: 220px; overflow-y: auto;
    }
    .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 36px 16px; border: 2px dashed var(--border); border-radius: var(--radius); text-align: center; }

    /* AUTH DROPDOWN */
    .user-menu-dropdown {
      position: absolute; right: 0; top: calc(100% + 8px);
      width: 240px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 14px;
      box-shadow: var(--shadow-lg); z-index: 50; padding: 6px;
      animation: fadeIn 0.15s ease-out;
    }
    .user-menu-item {
      display: flex; align-items: center; gap: 8px; width: 100%;
      padding: 9px 12px; font-size: 12.5px; color: var(--text2);
      border-radius: 8px; border: none; background: transparent;
      cursor: pointer; transition: all 0.15s; text-align: left;
    }
    .user-menu-item:hover { background: var(--surface2); color: var(--text); }

    /* DUAL SWITCH */
    .dual-toggle-card {
      padding: 12px 16px; border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(37,99,235,0.06), rgba(124,58,237,0.06));
      border: 1.5px solid rgba(37,99,235,0.25);
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }

    /* PRINT WATERMARK & CLEAN PDF EXPORT */
    .print-watermark { display: none; }
    @media print {
      .no-print, .sidebar, .topbar, .mob-stepbar, .user-menu-dropdown, .phone-notch-bar {
        display: none !important;
      }
      .phone-bezel, .simulated-mobile-wrapper {
        border: none !important;
        box-shadow: none !important;
        width: 100% !important;
        max-width: 100% !important;
        padding: 0 !important;
        background: transparent !important;
        height: auto !important;
      }
      .phone-screen-content {
        overflow: visible !important;
        height: auto !important;
        padding: 0 !important;
      }
      body, .main-area { background: #fff !important; color: #111 !important; margin: 0 !important; }

/* ═══════════════════════════════════════════════════════════
   CALCULATION LOGIC
═══════════════════════════════════════════════════════════ */
function calcItem(catId, qty, opts = {}) {
  const desp = S.cliente.desp || 0.10;
  if (catId === 'libre') {
    const pMat = +(opts.mat || 0), pMO = +(opts.mo || 0);
    const subtMat = pMat * qty;
    const subtMO = pMO * qty;
    const gan = 0.20 * (subtMat + subtMO);
    return {
      id: ++S._id,
      catId: 'libre',
      catalogId: null,
      nombre: opts.desc || (S.lang === 'en' ? 'Custom Item' : 'Partida libre'),
      nombre_es: opts.desc || 'Partida libre',
      nombre_en: opts.desc || 'Custom Item',
      groupName: S.lang === 'en' ? 'Custom' : 'Personalizada',
      qty,
      unidad: opts.unit || 'u',
      unitMat: pMat,
      unitMO: pMO,
      subtMat,
      subtMO,
      gan,
      total: subtMat + subtMO + gan,
      opts
    };
  }
  return null;
}

function recalc() {
  let mat = 0, mo = 0, gan = 0;
  S.items.forEach(i => { mat += i.subtMat; mo += i.subtMO; gan += (i.gan || 0); });
  
  // 1. Opción Estándar: Materiales balanceados homologados
  const totalStandard = mat + mo + gan;

  // 2. Opción Económica: Materiales estándar optimizados (-10%), mano de obra base y margen ajustado (12%)
  const matEcon = mat * 0.90;
  const moEcon = mo;
  const ganEcon = 0.12 * (matEcon + moEcon);
  const totalEcon = matEcon + moEcon + ganEcon;

  // 3. Opción Premium: Marcas líderes 1ª línea (+30%), mano de obra certificada (+15%), margen 22%
  const matPremium = mat * 1.30;
  const moPremium = mo * 1.15;
  const ganPremium = 0.22 * (matPremium + moPremium);
  const totalPremium = matPremium + moPremium + ganPremium;

  const isEn = S.lang === 'en';

  S.presup = {
    standard: {
      key: 'standard',
      name: isEn ? 'Standard Proposal' : 'Opción Estándar',
      chip: isEn ? 'Recommended' : 'Recomendada',
      icon: '⭐',
      desc: isEn ? 'Certified standard materials, balanced durability and formal warranty.' : 'Materiales estándar homologados, excelente durabilidad y rendimiento balanceado.',
      mat,
      mo,
      gan,
      total: totalStandard,
      warranty: isEn ? '180 days (6 months)' : '180 días (6 meses)'
    },
    economica: {
      key: 'economica',
      name: isEn ? 'Budget Proposal' : 'Opción Económica',
      chip: isEn ? 'Cost-Saver' : 'Ahorro / Accesible',
      icon: '🏷️',
      desc: isEn ? 'Cost-optimized materials, efficient labor and competitive margin.' : 'Materiales estándar de costo optimizado, mano de obra eficiente y margen accesible.',
      mat: matEcon,
      mo: moEcon,
      gan: ganEcon,
      total: totalEcon,
      warranty: isEn ? '60 days' : '60 días'
    },
    premium: {
      key: 'premium',
      name: isEn ? 'Premium Proposal' : 'Opción Premium',
      chip: isEn ? 'Top Tier' : 'Alta Gama',
      icon: '💎',
      desc: isEn ? 'Tier-1 leading brands (Schneider, Barbieri/Knauf, Tigre, Alba), reinforced seal and 1-year extended warranty.' : 'Marcas líderes de 1ª línea (Schneider/Sica, Barbieri/Knauf, Tigre, Alba), sellado reforzado y garantía extendida por 1 año.',
      mat: matPremium,
      mo: moPremium,
      gan: ganPremium,
      total: totalPremium,
      warranty: isEn ? '12 months (1 year)' : '12 meses (1 año)'
    }
  };
  saveActiveDraft();
}

function applyInfl(pct) {
  if (!S.isPro) {
    openUpsellModal('inflation');
    return;
  }
  const f = 1 + pct / 100;
  S.items = S.items.map(i => ({
    ...i,
    unitMat: (i.unitMat || 0) * f,
    unitMO: (i.unitMO || 0) * f,
    subtMat: i.subtMat * f,
    subtMO: i.subtMO * f,
    gan: (i.gan || 0) * f,
    total: i.total * f
  }));
  S.inflation += pct;
  recalc();
}

  const chosen = S.presup[curKey] || S.presup.standard;
  const std = S.presup.standard;
  const eco = S.presup.economica;
  const prm = S.presup.premium;

  const fecha = new Date().toLocaleDateString(S.lang === 'en' ? 'en-US' : 'es-AR', { day: '2-digit', month: 'long', year: 'numeric' });
  const nro = `P-${Date.now().toString().slice(-6)}`;

/* ─── MODAL DISPATCHER (CATÁLOGO TÉCNICO O PARTIDA LIBRE) ─── */
function modal() {
  if (S.catSel === 'libre') {
    return modalLibre();
  }
  return catalogModal();
}

/* ─── CATALOG MODAL: SELECCIÓN DETALLADA DE INSUMOS ──────── */
function catalogModal() {
  const catInfo = CATEGORIES[S.catSel];
  const catalog = CATEGORIES_CATALOG[S.catSel];
  if (!catalog || !catInfo) return '';

  const isEn = S.lang === 'en';
  const catTitle = isEn ? (catalog.title_en || catalog.title) : catalog.title;
  const desp = S.cliente.desp || 0.10;
  const country = S.country;

  // Compute live totals from S.catalogSelections
  let liveMat = 0, liveMO = 0, liveCount = 0;
  catalog.groups.forEach(group => {
    group.items.forEach(item => {
      const q = S.catalogSelections[item.id] || 0;
      if (q > 0) {
        liveCount++;
        const p = item.prices[country] || item.prices.ar;
        liveMat += q * p.mat * (1 + desp);
        liveMO += q * p.mo;
      }
    });
  });
  const liveTotal = (liveMat + liveMO) * 1.20; // 20% margin standard

  // Filter groups if a specific group tab is selected
  const activeGroupId = S.catalogActiveGroup || 'all';
  const search = (S.catalogSearch || '').toLowerCase().trim();

  return `
    <div class="modal-overlay no-print" onclick="closeModalOverlay(event)">
      <div class="catalog-modal-sheet">
        <!-- Top indicator -->
        <div style="width:36px;height:4px;border-radius:999px;background:var(--border);margin:0 auto 12px;flex-shrink:0;"></div>

        <!-- Header -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-shrink:0;">
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:38px;height:38px;border-radius:12px;background:${dark() ? catInfo.bgDark : catInfo.bg};color:${catInfo.color};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              ${ic(catInfo.icon, 20)}
            </div>
            <div>
              <div style="font-size:16px;font-weight:900;color:var(--text);">${catTitle}</div>
              <div style="font-size:11px;color:var(--text3);">Catálogo técnico con precios base de ${COUNTRIES[country].name}</div>
            </div>
          </div>
          <button onclick="closeModal()" class="btn btn-ghost btn-sm" style="padding:5px 8px;border-radius:50%;" title="${t('cancel')}">
            ${ic('x', 16)}
          </button>
        </div>

        <!-- Search input -->
        <div style="margin-bottom:10px;flex-shrink:0;position:relative;">
          <input
            id="cat-search-input"
            type="text"
            class="field"
            placeholder="${t('search_ph')}"
            value="${esc(S.catalogSearch)}"
            oninput="handleCatalogSearch(event)"
            style="padding:8px 12px 8px 32px;font-size:13px;"
          />
          <div style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text4);pointer-events:none;">
            ${ic('search', 14)}
          </div>
        </div>

        <!-- Group Filter Tabs -->
        <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;flex-shrink:0;">
          <button type="button" onclick="setCatalogGroup('all')"
            class="sub-option-btn${activeGroupId === 'all' ? ' active' : ''}"
            style="padding:6px 10px;font-size:11px;white-space:nowrap;flex:none;border-radius:8px;">
            ${t('all_groups')}
          </button>
          ${catalog.groups.map(g => {
            const gName = isEn ? g.name_en : g.name;
            return `
              <button type="button" onclick="setCatalogGroup('${g.id}')"
                class="sub-option-btn${activeGroupId === g.id ? ' active' : ''}"
                style="padding:6px 10px;font-size:11px;white-space:nowrap;flex:none;border-radius:8px;">
                ${gName}
              </button>
            `;
          }).join('')}
        </div>

        <!-- Scrollable Items List -->
        <div class="catalog-scrollable">
          ${catalog.groups.map(group => {
            if (activeGroupId !== 'all' && activeGroupId !== group.id) return '';
            
            const groupName = isEn ? group.name_en : group.name;
            const filteredItems = group.items.filter(it => {
              if (!search) return true;
              const n = (isEn ? it.name_en : it.name).toLowerCase();
              return n.includes(search);
            });

            if (filteredItems.length === 0) return '';

            return `
              <div style="margin-bottom:12px;">
                <div class="catalog-group-title">
                  <span>${groupName}</span>
                  <span style="font-weight:600;font-size:10px;opacity:0.7;">${filteredItems.length} insumos</span>
                </div>
                <div style="display:flex;flex-direction:column;gap:6px;">
                  ${filteredItems.map(item => {
                    const itemName = isEn ? item.name_en : item.name;
                    const q = S.catalogSelections[item.id] || 0;
                    const p = item.prices[country] || item.prices.ar;
                    const hasQty = q > 0;

                    return `
                      <div class="catalog-item-card ${hasQty ? 'has-qty' : ''}" id="cat-card-${item.id}">
                        <div style="flex:1;min-width:0;">
                          <div style="font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;">
                            <span>${esc(itemName)}</span>
                            ${hasQty ? `<span style="color:var(--accent);">${ic('check-circle-2', 13)}</span>` : ''}
                          </div>
                          <div style="font-size:11px;color:var(--text3);margin-top:2px;">
                            <span>${curFmt(p.mat)} ${t('unit_cost_label')} · ${curFmt(p.mo)} m.o. / ${item.unit}</span>
                          </div>
                        </div>

                        <!-- Tactile Stepper -->
                        <div class="stepper-wrap">
                          <button type="button" class="stepper-btn" onclick="adjustCatalogQty('${item.id}', -1)" aria-label="Restar">−</button>
                          <input
                            id="cat-inp-${item.id}"
                            type="number"
                            inputmode="numeric"
                            pattern="[0-9]*"
                            min="0"
                            class="stepper-input"
                            value="${q || 0}"
                            onfocus="this.select()"
                            oninput="changeCatalogInput('${item.id}', this.value)"
                          />
                          <button type="button" class="stepper-btn" onclick="adjustCatalogQty('${item.id}', 1)" aria-label="Sumar">+</button>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <!-- Sticky Footer with Live Calculations -->
        <div class="catalog-footer-sticky" id="cat-modal-summary">
          <div style="background:var(--surface2);border-radius:12px;padding:9px 12px;margin-bottom:10px;font-size:11.5px;">
            <div style="display:flex;justify-content:space-between;margin-bottom:3px;">
              <span style="color:var(--text3);">Materiales (${(desp * 100).toFixed(0)}% merma):</span>
              <span style="color:var(--text);font-weight:700;">${curFmt(liveMat)}</span>
            </div>
            <div style="display:flex;justify-content:space-between;margin-bottom:3px;">
              <span style="color:var(--text3);">Mano de obra recomendada:</span>
              <span style="color:var(--text);font-weight:700;">${curFmt(liveMO)}</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding-top:4px;border-top:1px solid var(--border);">
              <span style="color:var(--text);font-weight:800;">Total Estimado (${liveCount} ítems):</span>
              <span style="color:var(--accent);font-weight:900;font-size:13.5px;">${curFmt(liveTotal)}</span>
            </div>
          </div>

          <div style="display:flex;gap:8px;">
            <button type="button" onclick="closeModal()" class="btn btn-ghost btn-md" style="flex:1;">
              ${t('cancel')}

/* ═══════════════════════════════════════════════════════════
   CATALOG INTERACTION METHODS
═══════════════════════════════════════════════════════════ */
function adjustCatalogQty(itemId, delta) {
  const current = S.catalogSelections[itemId] || 0;
  const next = Math.max(0, current + delta);
  S.catalogSelections[itemId] = next;
  
  const inp = document.getElementById('cat-inp-' + itemId);
  if (inp) inp.value = next;
  
  const card = document.getElementById('cat-card-' + itemId);
  if (card) {
    if (next > 0) card.classList.add('has-qty');
    else card.classList.remove('has-qty');
  }

  updateCatalogFooterLive();
}

function changeCatalogInput(itemId, val) {
  const parsed = Math.max(0, parseInt(val, 10) || 0);
  S.catalogSelections[itemId] = parsed;
  
  const card = document.getElementById('cat-card-' + itemId);
  if (card) {
    if (parsed > 0) card.classList.add('has-qty');
    else card.classList.remove('has-qty');
  }

  updateCatalogFooterLive();
}

function handleCatalogSearch(e) {
  S.catalogSearch = e.target.value;
  // Re-render modal body smoothly
  const modalEl = document.querySelector('.modal-overlay');
  if (modalEl) {
    const parent = modalEl.parentElement;
    render();
    // restore focus to search
    setTimeout(() => {
      const s = $('cat-search-input');
      if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    }, 10);
  }
}

function setCatalogGroup(gId) {
  S.catalogActiveGroup = gId;
  render();
}

function updateCatalogFooterLive() {
  const catalog = CATEGORIES_CATALOG[S.catSel];
  if (!catalog) return;
  const desp = S.cliente.desp || 0.10;
  const country = S.country;

  let liveMat = 0, liveMO = 0, liveCount = 0;
  catalog.groups.forEach(group => {
    group.items.forEach(item => {
      const q = S.catalogSelections[item.id] || 0;
      if (q > 0) {
        liveCount++;
        const p = item.prices[country] || item.prices.ar;
        liveMat += q * p.mat * (1 + desp);
        liveMO += q * p.mo;
      }
    });
  });
  const liveTotal = (liveMat + liveMO) * 1.20;

  const footer = $('cat-modal-summary');
  if (footer) {
    footer.innerHTML = `
      <div style="background:var(--surface2);border-radius:12px;padding:9px 12px;margin-bottom:10px;font-size:11.5px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:3px;">
          <span style="color:var(--text3);">Materiales (${(desp * 100).toFixed(0)}% merma):</span>
          <span style="color:var(--text);font-weight:700;">${curFmt(liveMat)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;margin-bottom:3px;">
          <span style="color:var(--text3);">Mano de obra recomendada:</span>
          <span style="color:var(--text);font-weight:700;">${curFmt(liveMO)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding-top:4px;border-top:1px solid var(--border);">
          <span style="color:var(--text);font-weight:800;">Total Estimado (${liveCount} ítems):</span>
          <span style="color:var(--accent);font-weight:900;font-size:13.5px;">${curFmt(liveTotal)}</span>
        </div>
      </div>

      <div style="display:flex;gap:8px;">
        <button type="button" onclick="closeModal()" class="btn btn-ghost btn-md" style="flex:1;">
          ${t('cancel')}
        </button>
        <button type="button" onclick="confirmCatalogModal()" class="btn btn-primary btn-md" style="flex:2;">
          ${ic('plus-circle', 16)} ${t('add_catalog_items')} (${liveCount})
        </button>
      </div>
    `;
    if (window.lucide) lucide.createIcons();
  }
}

function confirmCatalogModal() {
  const catalog = CATEGORIES_CATALOG[S.catSel];
  if (!catalog) return;
  const desp = S.cliente.desp || 0.10;
  const country = S.country;
  const isEn = S.lang === 'en';

  catalog.groups.forEach(group => {
    group.items.forEach(cItem => {
      const qty = S.catalogSelections[cItem.id] || 0;
      const existingIdx = S.items.findIndex(it => it.catalogId === cItem.id);
      
      if (qty > 0) {
        const p = cItem.prices[country] || cItem.prices.ar;
        const subtMat = qty * p.mat * (1 + desp);
        const subtMO = qty * p.mo;
        const gan = 0.20 * (subtMat + subtMO);
        const total = subtMat + subtMO + gan;

        const itemData = {
          id: existingIdx >= 0 ? S.items[existingIdx].id : ++S._id,
          catId: S.catSel,
          catalogId: cItem.id,
          nombre: isEn ? cItem.name_en : cItem.name,
          nombre_es: cItem.name,
          nombre_en: cItem.name_en,
          groupName: isEn ? group.name_en : group.name,
          qty: qty,
          unidad: cItem.unit,
          unitMat: p.mat,
          unitMO: p.mo,
          subtMat,
          subtMO,
          gan,
          total,
          opts: { catalogId: cItem.id }
        };

        if (existingIdx >= 0) {
          S.items[existingIdx] = itemData;
        } else {
          S.items.push(itemData);
        }
      } else if (existingIdx >= 0) {
        // If qty was set to 0 in modal, remove it
        S.items.splice(existingIdx, 1);
      }
    });
  });

  S.modal = false;
  S.editing = null;
  saveActiveDraft();
  recalc();
  render();
}

function confirmModalLibre() {
  const descEl = $('l-desc');
  const desc = descEl?.value?.trim();
  if (!desc) {
    triggerFieldValidationError(descEl);
    return;
  }
  const qtyEl = $('l-qty');
  const qty = parseFloat(qtyEl?.value);
  if (isNaN(qty) || qty <= 0) {
    triggerFieldValidationError(qtyEl);
    return;
  }
  const mat = parseFloat($('l-mat')?.value || 0);
  const mo = parseFloat($('l-mo')?.value || 0);
  const item = calcItem('libre', qty, { desc, mat, mo });

  if (S.editing) {
    S.items = S.items.map(i => i.id === S.editing.id ? { ...item, id: i.id } : i);
  } else {
    S.items.push(item);
  }
  S.modal = false;
  S.editing = null;
  saveActiveDraft();
  recalc();
  render();
}

function quickChangeQty(id, delta) {
  const item = S.items.find(i => i.id === id);
  if (!item) return;
  const newQty = Math.max(0, parseFloat((item.qty + delta).toFixed(2)));
  if (newQty === 0) {
    delItem(id);
    return;
  }
  item.qty = newQty;
  const pMat = item.unitMat || 0;
  const pMO = item.unitMO || 0;
  const desp = S.cliente.desp || 0.10;
  item.subtMat = newQty * pMat * (1 + desp);
  item.subtMO = newQty * pMO;
  item.gan = 0.20 * (item.subtMat + item.subtMO);
  item.total = item.subtMat + item.subtMO + item.gan;
  saveActiveDraft();
  recalc();
  render();
}

function openModal(id) {
  S.catSel = id;
  S.modal = true;
  S.editing = null;
  S.catalogActiveGroup = 'all';
  S.catalogSearch = '';
  S.catalogSelections = {};

  if (id in CATEGORIES_CATALOG) {
    // Pre-populate with existing quantities
    S.items.forEach(it => {
      if (it.catId === id && it.catalogId) {
        S.catalogSelections[it.catalogId] = it.qty;
      }
    });
  }
  render();
}

function editItem(id) {
  const item = S.items.find(i => i.id === id);
  if (!item) return;
  if (item.catalogId && item.catId in CATEGORIES_CATALOG) {
    openModal(item.catId);
    return;
  }
  S.catSel = item.catId;
  S.editing = item;
  S.modal = true;
  render();
}

function delItem(id) {
  S.items = S.items.filter(i => i.id !== id);
  saveActiveDraft();
  recalc();
  render();
}

function closeModal() {
  S.modal = false;
  S.editing = null;
  render();
}

function closeModalOverlay(e) {
  if (e.target.classList.contains('modal-overlay')) closeModal();
}

function triggerFieldValidationError(el) {
  if (!el) return;
  el.focus();
  el.classList.add('field-error-shake');
  setTimeout(() => {
    el.classList.remove('field-error-shake');
  }, 1200);
}

/* ═══════════════════════════════════════════════════════════
   EVENT LISTENERS & STEP ROUTING
═══════════════════════════════════════════════════════════ */
function attachEvents() {
  const inpName = $('inp-name');
  if (inpName) {
    inpName.addEventListener('input', () => {
      S.cliente.nombre = inpName.value;
      saveActiveDraft();
    });
  }
  const inpDir = $('inp-dir');
  if (inpDir) {
    inpDir.addEventListener('input', () => {
      S.cliente.dir = inpDir.value;
      saveActiveDraft();
    });
  }
}

function goStep(n) {
  if (n === 3) recalc();
  S.paso = n;
  S.modal = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

function navStep(n) {
  if (n > S.paso) {
    if (n === 2 && S.paso === 1) { go2(); return; }
    return;
  }
  goStep(n);
}

function go2() {
  const name = $('inp-name')?.value?.trim();
  const dir = $('inp-dir')?.value?.trim() || '';
  if (!name) {
    const el = $('inp-name');
    if (el) triggerFieldValidationError(el);
    return;
  }
  if (!S.isPro && S.monthlyCount >= FREE_LIMIT) {
    openUpsellModal('limit');
    return;
  }
  S.cliente.nombre = name;
  S.cliente.dir = dir;
  saveActiveDraft();
  goStep(2);
}

function setDesp(v) {
  S.cliente.desp = v;
  // Recalculate existing items with new waste factor
  S.items.forEach(it => {
    if (it.unitMat) {
      it.subtMat = it.qty * it.unitMat * (1 + v);
      it.gan = 0.20 * (it.subtMat + it.subtMO);
      it.total = it.subtMat + it.subtMO + it.gan;
    }
  });
  saveActiveDraft();
  recalc();
  render();
}

function toggleDark() {
  S.dark = !S.dark;
  applyTheme();
  render();
}

function toggleLang() {
  S.lang = S.lang === 'es' ? 'en' : 'es';
  try { localStorage.setItem('presupuestapp_lang', S.lang); } catch(e) {}
  // Update item names from catalog in current language
  S.items.forEach(it => {
    if (it.nombre_es && it.nombre_en) {
      it.nombre = S.lang === 'en' ? it.nombre_en : it.nombre_es;
    }
  });
  recalc();
  render();
}

function toggleDualMode() {
  S.dualMode = !S.dualMode;
  saveActiveDraft();
  render();
}

function setFinalOption(opt) {
  S.finalOption = opt;
  saveActiveDraft();
  render();
}

function toggleMobileSimulator() {
  S.simulatedMobile = !S.simulatedMobile;
  render();
}

function openProjectsModal() { S.projectsModal = true; S.userMenuOpen = false; render(); }
function closeProjectsModal() { S.projectsModal = false; render(); }
function closeProjectsOverlay(e) { if (e.target.classList.contains('modal-overlay')) closeProjectsModal(); }

function saveCurrentProject() {
  if (!S.cliente.nombre && S.items.length === 0) {
    alert('Ingresa al menos el nombre del cliente o una partida antes de guardar la obra.');
    return;
  }
  const id = S.currentProjectId || 'proj_' + Date.now();
  const existingIdx = S.projects.findIndex(p => p.id === id);
  const projData = {
    id,
    cliente: { ...S.cliente },
    items: [ ...S.items ],
    dualMode: S.dualMode,
    finalOption: S.finalOption || 'standard',
    totals: {
      standard: S.presup?.standard?.total || 0,
      economica: S.presup?.economica?.total || 0,
      premium: S.presup?.premium?.total || 0
    },
    updatedAt: new Date().toISOString()
  };

  if (existingIdx >= 0) {
    S.projects[existingIdx] = projData;
  } else {
    S.projects.unshift(projData);
  }
  S.currentProjectId = id;
  saveStoredProjects(S.projects);
  saveActiveDraft();
  alert('✅ Obra guardada con éxito en tu historial de proyectos.');
  render();
}

function loadProject(id) {
  const p = S.projects.find(x => x.id === id);
  if (!p) return;
  S.cliente = { ...p.cliente };
  S.items = [ ...p.items ];
  S.dualMode = p.dualMode !== undefined ? p.dualMode : true;
  if (p.finalOption) S.finalOption = p.finalOption;
  S.currentProjectId = p.id;
  S.paso = S.items.length > 0 ? 2 : 1;
  saveActiveDraft();
  closeProjectsModal();
  render();
}

function deleteProject(id) {
  if (!confirm('¿Eliminar esta obra del historial?')) return;
  S.projects = S.projects.filter(p => p.id !== id);
  if (S.currentProjectId === id) S.currentProjectId = null;
  saveStoredProjects(S.projects);
  render();
}

function duplicateProject(id) {
  const orig = S.projects.find(p => p.id === id);
  if (!orig) return;
  const newProj = {
    ...orig,
    id: 'proj_' + Date.now(),
    cliente: { ...orig.cliente, nombre: orig.cliente.nombre + ' (Copia)' },
    updatedAt: new Date().toISOString()
  };
  S.projects.unshift(newProj);
  saveStoredProjects(S.projects);
  render();
}

function selectCountry(cId) {
  S.country = cId;
  S.countryModal = false;
  // Recalculate existing items with prices of selected country
  const desp = S.cliente.desp || 0.10;
  S.items.forEach(it => {
    if (it.catalogId && it.catId in CATEGORIES_CATALOG) {
      const cat = CATEGORIES_CATALOG[it.catId];
      cat.groups.forEach(g => {
        const found = g.items.find(x => x.id === it.catalogId);
        if (found) {
          const p = found.prices[cId] || found.prices.ar;
          it.unitMat = p.mat;
          it.unitMO = p.mo;
          it.subtMat = it.qty * p.mat * (1 + desp);
          it.subtMO = it.qty * p.mo;
          it.gan = 0.20 * (it.subtMat + it.subtMO);
          it.total = it.subtMat + it.subtMO + it.gan;
        }
      });
    }
  });
  recalc();
  render();
}

function handleLogoUpload(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    const img = new Image();
    img.onload = function() {
      const maxDim = 300;
      let width = img.width;
      let height = img.height;

      if (width > height) {
        if (width > maxDim) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        }
      } else {
        if (height > maxDim) {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
      }

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);

      const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
      S.brand.logo = compressedDataUrl;
      saveStoredBrand(S.brand);
      render();
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
}
